plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.webquest.game"
    compileSdk 35

    defaultConfig {
        applicationId "com.webquest.game"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir("generated/web-assets"))
    }
}

def syncWebAssets = tasks.register("syncWebAssets", Sync) {
    from(rootProject.projectDir.parentFile) {
        include "client/**"
        include "shared/**"
        exclude "**/.DS_Store"
    }
    into(layout.buildDirectory.dir("generated/web-assets"))
}

tasks.named("preBuild").configure {
    dependsOn(syncWebAssets)
}
